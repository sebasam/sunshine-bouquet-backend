<div class="d-flex justify-content-between align-items-center mb-4 mt-3">
  <h2>Dashboard</h2>
  <a routerLink="/orders/list" class="btn btn-outline-primary">Ver Listado Detallado</a>
</div>
<div class="row mb-4">
  <div class="col-md-3">
    <div class="card text-white bg-primary mb-3 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Total Órdenes</h5>
        <p class="card-text display-4">{{ totalOrders }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-3" *ngFor="let status of statusCounts | keyvalue">
    <div class="card bg-light mb-3 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">{{ status.key }}</h5>
        <p class="card-text display-4">{{ status.value }}</p>
      </div>
    </div>
  </div>
</div>

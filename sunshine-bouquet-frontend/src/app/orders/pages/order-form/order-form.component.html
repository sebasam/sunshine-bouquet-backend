<div class="row justify-content-center mt-5">
  <div class="col-md-8">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-dark text-white">
        <h3 class="mb-0 fs-5">Crear Nueva Orden de Exportación</h3>
      </div>
      <div class="card-body bg-light">
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
        
        <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label fw-bold">Tienda Cliente</label>
            <input type="text" class="form-control" formControlName="customerStore" placeholder="Ej. Walmart, Target...">
          </div>
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">País de Origen</label>
              <input type="text" class="form-control" formControlName="originCountry" placeholder="Ej. Colombia">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Ciudad de Destino</label>
              <input type="text" class="form-control" formControlName="destinationCity" placeholder="Ej. Miami">
            </div>
          </div>
          
          <div class="mb-4">
            <label class="form-label fw-bold">Cantidad de Ramos (Bouquets)</label>
            <input type="number" class="form-control" formControlName="bouquetQuantity" min="1">
          </div>
          
          <div class="d-flex justify-content-end border-top pt-3">
            <a routerLink="/orders/list" class="btn btn-outline-secondary me-2">Cancelar</a>
            <button type="submit" class="btn btn-primary" [disabled]="orderForm.invalid || isSubmitting">
              {{ isSubmitting ? 'Guardando...' : 'Guardar Orden' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

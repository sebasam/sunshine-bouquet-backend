version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sunshine_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql

  backend:
    build:
      context: ./sunshine-bouquet-backend
      dockerfile: SunshineBouquet.Api/Dockerfile
    container_name: sunshine_backend
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=SunshineBouquetDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;

  gateway:
    build:
      context: ./sunshine-bouquet-gateway
      dockerfile: Dockerfile
    container_name: sunshine_gateway
    ports:
      - "4000:4000"
    depends_on:
      - backend
    restart: always

  frontend:
    build:
      context: ./sunshine-bouquet-frontend
      dockerfile: Dockerfile
    container_name: sunshine_frontend
    ports:
      - "80:80"
    depends_on:
      - gateway

volumes:
  sqlvolume: